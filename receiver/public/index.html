<!doctype html>
<!--
  Tonearm's Cast receiver. The device opens this page when Tonearm casts
  with its own receiver app (TONEARM_CAST_APP). The music is Tonearm's
  stream from the computer, played by the page's audio element. Tonearm
  sends the song playing on urn:x-cast:app.tonearm, and the page shows its
  cover, title, artist and progress, with the song's synced lyrics beside
  them when it has any. It also puts the song in the media status, so
  speakers, smart clocks and the Google Home app show it too.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tonearm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root {
    --ink: #ffffff;
    --soft: rgba(255, 255, 255, 0.72);
    --faint: rgba(255, 255, 255, 0.22);
    --ground: #0b0b0f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--ground); color: var(--ink);
    font-family: Figtree, system-ui, sans-serif;
  }
  audio { display: none; }

  /* The cover, blown up and blurred, behind everything. */
  .backdrop {
    position: absolute; inset: -10%;
    background-size: cover; background-position: center;
    filter: blur(80px) saturate(1.4) brightness(0.45);
    transition: opacity 1.2s ease;
  }
  .backdrop.hidden { opacity: 0; }

  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; gap: 6vw;
    padding: 0 9vw;
    /* Drifts a few pixels over minutes, so a TV never holds one picture. */
    animation: drift 240s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(-0.6vw, -0.6vh); }
    to { transform: translate(0.6vw, 0.6vh); }
  }

  .song { display: flex; align-items: center; gap: 6vw; min-width: 0; flex: 1; }
  .cover {
    flex: none; width: 46vh; height: 46vh; border-radius: 1.6vh;
    background: #222 center / cover no-repeat;
    box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.55);
  }
  .text { min-width: 0; flex: 1; }
  .title {
    font-size: 6.4vh; font-weight: 700; line-height: 1.12;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .artist, .album {
    font-size: 3.4vh; font-weight: 500; color: var(--soft); margin-top: 1.4vh;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .album { font-size: 2.8vh; margin-top: 0.8vh; }

  .progress { margin-top: 6vh; max-width: 70vh; }
  .bar { height: 0.7vh; border-radius: 0.35vh; background: var(--faint); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--ink); border-radius: inherit; }
  .times {
    display: flex; justify-content: space-between;
    margin-top: 1.4vh; font-size: 2.4vh; color: var(--soft);
    font-variant-numeric: tabular-nums;
  }
  .paused .fill { opacity: 0.5; }

  .brand {
    position: absolute; right: 5vw; bottom: 5vh;
    font-size: 2.4vh; font-weight: 700; letter-spacing: 0.04em; color: var(--soft);
  }

  /* Before the first song arrives. */
  .waiting .stage { justify-content: center; }
  .waiting .song { flex: none; }
  .waiting .cover, .waiting .progress, .waiting .album { display: none; }
  .waiting .text { flex: none; text-align: center; }

  /* A song with synced lyrics: the song in a column on the left, its
     lyrics on the right. */
  .lyrics { display: none; }
  .lyrical .stage { gap: 7vw; padding: 0 6vw 0 8vw; }
  .lyrical .song {
    flex: none; width: 44vh;
    flex-direction: column; align-items: stretch; gap: 0;
  }
  .lyrical .cover { width: 44vh; height: 44vh; }
  .lyrical .text { margin-top: 4.4vh; }
  .lyrical .title { font-size: 4.4vh; }
  .lyrical .artist { font-size: 2.9vh; margin-top: 1vh; }
  .lyrical .album { font-size: 2.4vh; margin-top: 0.6vh; }
  .lyrical .progress { margin-top: 3.6vh; max-width: none; }
  .lyrical .times { font-size: 2.1vh; margin-top: 1.1vh; }
  .lyrical .brand { right: auto; left: 8vw; }

  .lyrical .lyrics {
    display: block; position: relative; flex: 1; min-width: 0; height: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent 0, #000 22%, #000 72%, transparent 100%);
    mask-image: linear-gradient(transparent 0, #000 22%, #000 72%, transparent 100%);
  }
  .lines {
    position: absolute; left: 0; right: 0; top: 0;
    transition: transform 0.7s cubic-bezier(0.22, 0.8, 0.24, 1);
  }
  .line {
    padding: 1.5vh 0;
    font-size: 5vh; font-weight: 800; line-height: 1.2; letter-spacing: -0.005em;
    opacity: 0.3;
    transform: scale(0.94); transform-origin: left center;
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.22, 0.8, 0.24, 1);
  }
  .line.past { opacity: 0.22; }
  .line.now { opacity: 1; transform: none; }
  .line .backing { font-size: 3.2vh; font-weight: 700; color: var(--soft); margin-top: 0.6vh; }
  .line .translation { font-size: 2.9vh; font-weight: 500; color: var(--soft); margin-top: 0.8vh; }

  /* A long gap in the singing: three dots that breathe while it lasts. */
  .gap { display: flex; gap: 1.4vh; padding: 2.6vh 0; opacity: 0.3; transition: opacity 0.5s ease; }
  .gap.past { opacity: 0.22; }
  .gap.now { opacity: 1; }
  .gap i {
    width: 1.6vh; height: 1.6vh; border-radius: 50%; background: var(--ink);
  }
  .gap.now i { animation: breathe 1.8s ease-in-out infinite; }
  .gap.now i:nth-child(2) { animation-delay: 0.3s; }
  .gap.now i:nth-child(3) { animation-delay: 0.6s; }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .swap { animation: swap 0.6s ease; }
  @keyframes swap {
    from { opacity: 0; transform: translateY(1.2vh); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body class="waiting">
<div class="backdrop hidden" id="backdrop"></div>
<div class="stage" id="stage">
  <div class="song" id="song">
    <div class="cover" id="cover"></div>
    <div class="text" id="text">
      <div class="title" id="title">Tonearm</div>
      <div class="artist" id="artist"></div>
      <div class="album" id="album"></div>
      <div class="progress" id="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="times"><span id="at">0:00</span><span id="length"></span></div>
      </div>
    </div>
  </div>
  <div class="lyrics" id="lyrics"><div class="lines" id="lines"></div></div>
</div>
<div class="brand">Tonearm</div>
<audio id="sink"></audio>

<script>
  const NAMESPACE = 'urn:x-cast:app.tonearm';
  const $ = (id) => document.getElementById(id);
  const sink = $('sink');

  // Seconds of silence before a line, or between two, that show as dots.
  const INTRO_GAP = 3;
  const GAP = 5;
  // A line lights up this much before it is sung, which reads as on time.
  const EARLY = 0.15;

  // The song shown, and the clock its progress runs on.
  let song = null;
  // `position` is where the song stood when Tonearm said, `at` when that
  // was, and `media` how far the audio element had played then.
  let clock = { position: 0, at: 0, media: 0, paused: true };

  // Lyrics by song id, as Tonearm sends them, and the ones on show.
  const lyrics = new Map();
  let shown = { id: null, rows: [], elements: [], now: -1 };

  function clockText(seconds) {
    const s = Math.max(0, Math.floor(seconds));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function cssUrl(url) {
    return url ? 'url("' + url.replace(/["\\]/g, '') + '")' : 'none';
  }

  function replay(element) {
    element.classList.remove('swap');
    void element.offsetWidth;
    element.classList.add('swap');
  }

  // How far into the song the sound is. The audio element's own clock
  // keeps time once it plays, so the lyrics wait while the device buffers.
  // Without a stream (a page opened to look at), the wall clock does.
  function heard() {
    if (!song) return 0;
    let elapsed = 0;
    if (!clock.paused) {
      elapsed = sink.currentSrc
        ? Math.max(0, sink.currentTime - clock.media)
        : (performance.now() - clock.at) / 1000;
    }
    const duration = song.duration || 0;
    const position = clock.position + elapsed;
    return duration > 0 ? Math.min(position, duration) : position;
  }

  function show(now) {
    const changed = !song || song.id !== now.id || song.title !== now.title ||
      song.artist !== now.artist || song.cover !== now.cover;
    song = now;
    clock = {
      position: now.position || 0,
      at: performance.now(),
      media: sink.currentTime || 0,
      paused: !!now.paused,
    };
    if (changed) {
      document.body.classList.remove('waiting');
      $('title').textContent = now.title || '';
      $('artist').textContent = now.artist || '';
      $('album').textContent = now.album || '';
      $('length').textContent = now.duration > 0 ? clockText(now.duration) : '';
      $('progress').style.visibility = now.duration > 0 ? 'visible' : 'hidden';
      $('cover').style.backgroundImage = cssUrl(now.cover);
      $('backdrop').style.backgroundImage = cssUrl(now.cover);
      $('backdrop').classList.toggle('hidden', !now.cover);
      replay($('cover'));
      replay($('text'));
      showLyrics();
    }
    document.body.classList.toggle('paused', clock.paused);
    tick();
    if (changed) announce(now);
  }

  // The rows for a song's lines: each line, with dots where the singing
  // stops long enough to notice. Times in seconds.
  function rowsFor(lines) {
    const rows = [];
    const sung = lines
      .map((l) => ({
        start: (l.start || 0) / 1000,
        end: (l.end || 0) / 1000,
        text: (l.text || '').trim(),
        backing: (l.background || '').trim(),
        translation: (l.translation || '').trim(),
      }))
      .sort((a, b) => a.start - b.start);
    sung.forEach((line, i) => {
      const next = sung[i + 1];
      if (line.end <= line.start) line.end = next ? next.start : line.start + 4;
      // A line with no words is a break the lyrics mark themselves.
      if (!line.text) {
        rows.push({ gap: true, start: line.start });
        return;
      }
      if (i === 0 && line.start >= INTRO_GAP) rows.push({ gap: true, start: 0 });
      rows.push(line);
      if (next && next.start - line.end >= GAP) rows.push({ gap: true, start: line.end });
    });
    return rows;
  }

  function showLyrics() {
    const id = song ? song.id : null;
    const lines = id ? lyrics.get(id) : null;
    const has = !!(lines && lines.length);
    const was = document.body.classList.contains('lyrical');
    if (shown.id === id && has === was && (!has || shown.lines === lines)) return;

    const box = $('lines');
    box.textContent = '';
    box.style.transition = 'none';
    box.style.transform = 'none';
    shown = { id, lines, rows: has ? rowsFor(lines) : [], elements: [], now: -1 };
    for (const row of shown.rows) {
      const element = document.createElement('div');
      if (row.gap) {
        element.className = 'gap';
        element.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
      } else {
        element.className = 'line';
        element.textContent = row.text;
        for (const [kind, words] of [['backing', row.backing], ['translation', row.translation]]) {
          if (!words) continue;
          const extra = document.createElement('div');
          extra.className = kind;
          extra.textContent = words;
          element.append(extra);
        }
      }
      box.append(element);
      shown.elements.push(element);
    }
    if (has !== was) {
      document.body.classList.toggle('lyrical', has);
      // Not the stage: its own animation keeps the picture moving.
      replay($('song'));
      if (has) replay($('lyrics'));
    }
    void box.offsetWidth;
    box.style.transition = '';
    follow(true);
  }

  // Lights the line being sung and scrolls it to just above the middle.
  function follow(force) {
    if (!shown.rows.length) return;
    const t = heard() + EARLY;
    let now = -1;
    for (let i = 0; i < shown.rows.length && shown.rows[i].start <= t; i++) now = i;
    if (now === shown.now && !force) return;
    shown.now = now;
    shown.elements.forEach((element, i) => {
      element.classList.toggle('now', i === now);
      element.classList.toggle('past', i < now);
    });
    const target = shown.elements[Math.max(now, 0)];
    const box = $('lyrics');
    const anchor = box.clientHeight * 0.4 - target.offsetHeight / 2;
    $('lines').style.transform = 'translateY(' + (anchor - target.offsetTop) + 'px)';
  }

  // Tells everything that follows this cast (the device's own display,
  // the Google Home app, phone notifications) about the song, through the
  // media status. Speakers with no web page to show rely on this alone.
  function announce(now) {
    const media = player.getMediaInformation();
    if (!media) return;
    const meta = new cast.framework.messages.MusicTrackMediaMetadata();
    meta.title = now.title || '';
    meta.artist = now.artist || '';
    meta.albumName = now.album || '';
    if (now.cover) meta.images = [new cast.framework.messages.Image(now.cover)];
    media.metadata = meta;
    player.setMediaInformation(media, true);
  }

  function tick() {
    if (!song) return;
    const position = heard();
    const duration = song.duration || 0;
    $('at').textContent = clockText(position);
    $('fill').style.width = duration > 0 ? (100 * position / duration) + '%' : '0';
    follow(false);
  }
  setInterval(tick, 100);

  const context = cast.framework.CastReceiverContext.getInstance();
  const player = context.getPlayerManager();
  player.setMediaElement(sink);

  // Until Tonearm says which song, show what the load named.
  player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
    const meta = request.media && request.media.metadata;
    if (meta && !song) {
      $('title').textContent = meta.title || 'Tonearm';
      $('artist').textContent = meta.artist || '';
    }
    return request;
  });

  // A song that arrived before the stream had loaded goes out once it has.
  player.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
    if (song) announce(song);
  });

  // The stream is live, so seeking it means nothing: what a phone or the
  // Google Home app offers is pause, volume, and the next or last song.
  try {
    const Command = cast.framework.messages.Command;
    const COMMANDS = Command.PAUSE | Command.STREAM_VOLUME | Command.STREAM_MUTE |
      Command.QUEUE_NEXT | Command.QUEUE_PREV;
    player.setSupportedMediaCommands(COMMANDS, false);
    player.setMessageInterceptor(cast.framework.messages.MessageType.MEDIA_STATUS, (status) => {
      status.supportedMediaCommands = COMMANDS;
      return status;
    });

    // Next and previous are Tonearm's to do. Pass them on to it.
    function skip(forward) {
      context.sendCustomMessage(NAMESPACE, undefined, { type: forward ? 'NEXT' : 'PREVIOUS' });
    }
    player.setMessageInterceptor(cast.framework.messages.MessageType.QUEUE_UPDATE, (request) => {
      if (request.jump) skip(request.jump > 0);
      return null;
    });
    for (const type of ['QUEUE_NEXT', 'QUEUE_PREV']) {
      if (cast.framework.messages.MessageType[type]) {
        player.setMessageInterceptor(cast.framework.messages.MessageType[type], () => {
          skip(type === 'QUEUE_NEXT');
          return null;
        });
      }
    }
    player.setMessageInterceptor(cast.framework.messages.MessageType.SEEK, () => null);
  } catch (e) {
    console.error('tonearm: media commands', e);
  }

  context.addCustomMessageListener(NAMESPACE, (event) => {
    try {
      const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (!data) return;
      if (data.type === 'NOW') show(data);
      if (data.type === 'LYRICS' && data.id && Array.isArray(data.lines)) {
        lyrics.delete(data.id);
        lyrics.set(data.id, data.lines);
        // Only the last few songs' lyrics are kept.
        while (lyrics.size > 4) lyrics.delete(lyrics.keys().next().value);
        if (song && song.id === data.id) showLyrics();
      }
    } catch (e) {
      console.error('tonearm: message', e);
    }
  });

  // The column's height changes the middle the lines scroll to.
  window.addEventListener('resize', () => follow(true));

  const options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
  // Tonearm's stream is a plain WAV. No adaptive players to fetch.
  options.skipPlayersLoad = true;
  context.start(options);
</script>
</body>
</html>
