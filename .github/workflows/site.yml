name: Landing page

# Deploys the landing page (site/, served at tonearm.eli-zac.dev by a
# Cloudflare Worker) whenever a change to it reaches main. A manual run from
# the Actions tab deploys the page as it is.
#
# It needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token that can edit Workers and DNS on the zone
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account's ID
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: landing-page
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first."
            exit 1
          fi
          # A secret set from Windows can carry a byte order mark or a newline,
          # which an HTTP header refuses: keep only the printable characters.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C tr -cd '[:alnum:]_-')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | LC_ALL=C tr -cd '[:alnum:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy
