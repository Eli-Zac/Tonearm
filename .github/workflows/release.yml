name: Release

# Builds tonearm.exe on Windows and attaches it to a GitHub release.
# Start it from the Actions tab with a version, or push a tag like v0.1.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release, for example v0.1.0
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cp target/release/tonearm.exe tonearm.exe
          gh release create "$VERSION" tonearm.exe \
            --target "$GITHUB_SHA" \
            --title "Tonearm $VERSION" \
            --generate-notes
