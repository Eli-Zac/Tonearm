name: Release

# Builds tonearm.exe and its installer on Windows and attaches both to a
# GitHub release.
# Start it from the Actions tab with a version, or push a tag like v0.1.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release, for example v0.1.0
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        env:
          # Baked into the exe so the in-app updater knows what it runs.
          TONEARM_VERSION: ${{ inputs.version || github.ref_name }}
          # Tonearm's own service keys, from the repository secrets.
          TONEARM_DISCORD_APP: ${{ secrets.TONEARM_DISCORD_APP }}
          TONEARM_LASTFM_KEY: ${{ secrets.TONEARM_LASTFM_KEY }}
          TONEARM_LASTFM_SECRET: ${{ secrets.TONEARM_LASTFM_SECRET }}
        run: cargo build --release --locked

      # NSIS comes with the Windows runner image.
      - name: Installer
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          makensis -V3 "-DVERSION=${VERSION#v}" "-DEXE=..	argetelease	onearm.exe" installer/tonearm.nsi

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # The bare exe is for 0.5 and older, whose updater looks for it.
          cp target/release/tonearm.exe tonearm.exe
          gh release create "$VERSION" tonearm-setup.exe tonearm.exe \
            --target "$GITHUB_SHA" \
            --title "Tonearm $VERSION" \
            --generate-notes
