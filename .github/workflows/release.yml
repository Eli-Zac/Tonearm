name: Release

# Push a tag like v0.1.0 and this builds tonearm.exe on Windows and
# attaches it to a GitHub release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/tonearm.exe tonearm.exe
          gh release create "$GITHUB_REF_NAME" tonearm.exe \
            --title "Tonearm $GITHUB_REF_NAME" \
            --generate-notes
