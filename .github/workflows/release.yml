name: Release

# Builds the Windows binary and installer and publishes them as a GitHub
# release. Start a release by pushing a version tag:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# A manual run from the Actions tab needs that tag to exist already: the
# workflow token cannot create a tag on commits that change workflow files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag (e.g. v1.2.0)
        required: true
      reuse_run:
        description: >-
          Run ID to reuse the binary from, skipping compilation. Use only to
          retry a failed packaging or publishing step with the same version.
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release tag exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION does not exist. Push it first: git tag $VERSION && git push origin $VERSION"
            exit 1
          fi

      # Falls back to the most recent cache when Cargo.lock changes, and
      # saves even if a later step fails.
      - name: Restore Cargo cache
        if: ${{ !inputs.reuse_run }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          cache-on-failure: true

      - name: Build release binary
        if: ${{ !inputs.reuse_run }}
        env:
          # Embedded in the binary for the in-app updater.
          TONEARM_VERSION: ${{ env.VERSION }}
          TONEARM_DISCORD_APP: ${{ secrets.TONEARM_DISCORD_APP }}
          TONEARM_LASTFM_KEY: ${{ secrets.TONEARM_LASTFM_KEY }}
          TONEARM_LASTFM_SECRET: ${{ secrets.TONEARM_LASTFM_SECRET }}
        run: cargo build --release --locked

      # Retained so a failed run can be retried via reuse_run without
      # recompiling.
      - name: Upload binary artifact
        if: ${{ !inputs.reuse_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tonearm-exe
          path: target/release/tonearm.exe
          retention-days: 7

      - name: Download binary from run ${{ inputs.reuse_run }}
        if: ${{ inputs.reuse_run }}
        uses: actions/download-artifact@v4
        with:
          name: tonearm-exe
          path: target/release
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}

      - name: Install NSIS
        shell: bash
        run: |
          if [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - name: Build installer
        shell: bash
        run: |
          "/c/Program Files (x86)/NSIS/makensis.exe" -V3 "-DVERSION=${VERSION#v}" installer/tonearm.nsi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The standalone binary is kept for the updater in v0.5.0 and earlier.
          cp target/release/tonearm.exe tonearm.exe
          gh release create "$VERSION" tonearm-setup.exe tonearm.exe \
            --target "$GITHUB_SHA" \
            --title "Tonearm $VERSION" \
            --generate-notes
