name: Android release

# Builds the phone app and attaches Tonearm-<version>.apk to the release the
# desktop workflow (release.yml) creates for the same tag. The phone's
# in-app updater looks for that file.
#
# It needs these repository secrets (see the release notes in the repository
# for how they are made):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password
#
# A manual run with publish off builds and keeps the APK as a workflow
# artifact only, to try the build without touching a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v1.2.0)
        required: true
      publish:
        description: Attach the APK to the release for that tag
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  apk:
    name: Build the APK
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          name="${VERSION#v}"
          IFS=. read -r major minor patch <<< "${name%%[-+]*}"
          # 0.11.0 becomes 1100: Android wants a whole number that only goes up.
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          cache-on-failure: true

      - name: Install Android build tools
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          # Gradle fetches the SDK parts it needs once the licenses are accepted.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --licenses > /dev/null || true

      - name: Build the Rust core
        shell: pwsh
        env:
          TONEARM_ANDROID_TARGET: ${{ runner.temp }}\tonearm-android-target
          TONEARM_DISCORD_APP: ${{ secrets.TONEARM_DISCORD_APP }}
          TONEARM_LASTFM_KEY: ${{ secrets.TONEARM_LASTFM_KEY }}
          TONEARM_LASTFM_SECRET: ${{ secrets.TONEARM_LASTFM_SECRET }}
        run: |
          $env:ANDROID_NDK_HOME = (Get-ChildItem "$env:ANDROID_HOME\ndk" -Directory | Sort-Object Name | Select-Object -Last 1).FullName
          .\android\build-rust.ps1 -Release -Arm64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the signed APK
        shell: bash
        env:
          TONEARM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TONEARM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TONEARM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TONEARM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$TONEARM_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set, so the APK cannot be signed."
            exit 1
          fi
          echo "$TONEARM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tonearm.keystore"
          export TONEARM_KEYSTORE="$RUNNER_TEMP/tonearm.keystore"
          cd android
          ./gradlew.bat assembleRelease --console=plain \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk "../Tonearm-${{ steps.version.outputs.name }}.apk"

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tonearm-apk
          path: Tonearm-${{ steps.version.outputs.name }}.apk
          retention-days: 14

      # The desktop workflow makes the release itself; wait for it to exist.
      - name: Attach the APK to the release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$VERSION" > /dev/null 2>&1; then
              gh release upload "$VERSION" "Tonearm-${{ steps.version.outputs.name }}.apk" --clobber
              exit 0
            fi
            echo "Waiting for the release $VERSION to exist ($i/60)..."
            sleep 30
          done
          echo "::error::No release for $VERSION appeared in 30 minutes."
          exit 1
