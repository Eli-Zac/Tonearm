[package]
name = "tonearm"
version = "0.13.1"
edition = "2021"
description = "Native Windows client for YouTube Music. No web views."
license = "GPL-3.0-only"
repository = "https://github.com/Eli-Zac/tonearm"
publish = false

[workspace]
members = ["crates/tonearm-core", "crates/tonearm-android"]

[dependencies]
tonearm-core = { path = "crates/tonearm-core", features = ["beat-model"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "raw-window-handle-06", "unstable-winit-030"] }
ureq = { version = "2.12", default-features = false, features = ["json", "gzip", "native-tls", "proxy-from-env"] }
native-tls = "0.2"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac", "symphonia-isomp4"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
dirs = "6"
roxmltree = "0.20"
md5 = "0.7"
# Already built for Slint's text. Draws blurred lyric lines.
swash = "0.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
# Runs YouTube's player script to solve stream link challenges.
rquickjs = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading"] }
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_NetworkManagement_Dns", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Foundation"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# Quick optimized builds for local work. Skips the slow whole program
# optimization that the release profile does.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
