[package]
name = "tonearm"
version = "0.3.0"
edition = "2021"
description = "Native Windows client for YouTube Music. No web views."
publish = false

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
ureq = { version = "2.12", default-features = false, features = ["json", "gzip", "native-tls", "proxy-from-env"] }
native-tls = "0.2"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac", "symphonia-isomp4"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
dirs = "6"
roxmltree = "0.20"
md5 = "0.7"

[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_Media_MediaFoundation"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# Quick optimized builds for local work. Skips the slow whole program
# optimization that the release profile does.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
